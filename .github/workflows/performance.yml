# US-605: performance baseline (A-41). On demand only: too slow and noisy on shared runners to gate every PR.
name: Performance baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Burst of 10,000 stream trades; REST at 50 requests per second
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the performance tests (Testcontainers, single instance)
        run: ./mvnw -B verify -Pperformance -DskipUnitTests=true -Djacoco.skip=true

      - name: Publish the summary
        if: always()
        run: cat target/performance/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: performance
          if-no-files-found: warn
          path: |
            target/performance/
            target/failsafe-reports/
