# Publishes the project portal (portal/index.html) to GitHub Pages after every green CI run on main, with that run's
# reports: coverage, Trivy, ZAP and the rendered diagrams. The page reads live pipeline status from the GitHub API.
name: Portal

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job (which runs no repository code) can write to Pages.
permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the portal
    # Only a green CI run of a push to this repository's main. A fork's pull request from a branch named "main"
    # also matches `branches: [main]`, so the event and the head repository are checked too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Find the CI run and the commit it tested
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            # Manual run: the latest green CI run of a push to main, so the page and its reports describe one commit
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success -L 1 \
              --json databaseId,headSha -q '.[0] | "id=\(.databaseId)\nsha=\(.headSha)"' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the commit CI tested
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Download that run's reports
        uses: actions/download-artifact@v8.0.2
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: ci-reports

      - name: Assemble the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTAL_SHA: ${{ steps.run.outputs.sha }}
          PORTAL_RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          mkdir -p site/data site/diagrams site/reports/coverage site/reports/security site/reports/dast
          cp portal/index.html site/
          python3 scripts/portal_data.py --reports ci-reports --out site/data/portal.json
          python3 scripts/portal_status.py --out site/data/status.json || echo '{}' > site/data/status.json
          find ci-reports -name '*.svg' -exec cp {} site/diagrams/ \;
          jacoco=$(find ci-reports -type d -path '*site/jacoco' | head -1)
          [ -n "$jacoco" ] && cp -r "$jacoco"/. site/reports/coverage/
          find ci-reports -name 'trivy-*.txt' -exec cp {} site/reports/security/ \;
          find ci-reports -name 'zap-report.*' -exec cp {} site/reports/dast/ \;
          touch site/.nojekyll
          ls -R site | head -50

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
