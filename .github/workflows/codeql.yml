# SAST: CodeQL static analysis of the Java code (A-48). Findings appear in the repository's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'   # weekly, so new CodeQL queries also run against unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: java-kotlin
          build-mode: none          # analyses the source directly; no Maven build needed
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:java-kotlin
