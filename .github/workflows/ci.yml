# CI pipeline (AGENTS.md section 6, US-601, US-602, US-603).
# Fails on: diagram syntax error, test failure, coverage < 80%, CRITICAL vulnerability.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maven Central occasionally refuses or drops downloads on shared runners: retry them
  MAVEN_ARGS: -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.requestSentEnabled=true
  PLANTUML_IMAGE: plantuml/plantuml:1.2026.9
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1
  TRIVY_VERSION: v0.70.0
  IMAGE_NAME: trade-store

jobs:
  build:
    name: Build, test, scan, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 1. Checkout and JDK (with Maven dependency cache)
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 2. Render and validate PlantUML diagrams (fails on syntax error)
      - name: Render PlantUML diagrams
        run: |
          docker run --rm -v "$PWD/docs/diagrams:/data" -w /data "$PLANTUML_IMAGE" \
            -tsvg -failfast2 -o out "*.puml"

      # 3. Build and unit tests
      - name: Unit tests
        run: ./mvnw -B test

      # 4 + 5. Integration / regression tests (Testcontainers), coverage report and gate (JaCoCo)
      - name: Integration tests and coverage gate
        run: ./mvnw -B verify -DskipUnitTests=true

      # 5b. Traceability: Requirements -> epics -> stories -> acceptance criteria -> tests -> code (US-608)
      - name: Traceability matrix and tag check
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/traceability.py --out target/traceability-committed.md
          if ! diff -u docs/traceability.md target/traceability-committed.md; then
            echo "::error::docs/traceability.md is out of date. Run 'python3 scripts/traceability.py' and commit it."
            exit 1
          fi
          python3 scripts/traceability.py --results target/surefire-reports target/failsafe-reports \
            --out target/traceability.md --check
          cat target/traceability.md >> "$GITHUB_STEP_SUMMARY"

      # 6a. OSS vulnerability scan of dependencies (fails on CRITICAL)
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          format: table
          output: trivy-dependencies.txt

      # 6b. Full report of every severity, never failing the build (US-602.2): uploaded with the other reports
      - name: Trivy full report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          format: table
          output: trivy-full-report.txt

      # 8. Package the Docker image
      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      # 6c. OSS vulnerability scan of the image, including OS packages (fails on CRITICAL)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          format: table
          output: trivy-image.txt

      - name: Show scan results
        if: always()
        run: |
          for f in trivy-dependencies.txt trivy-image.txt; do
            [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; } || true
          done

      # 9. Upload test, coverage and scan reports, plus rendered diagrams
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/traceability.md
            trivy-*.txt

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagrams
          if-no-files-found: warn
          path: docs/diagrams/out/*.svg

  # US-606.1: the one-command local run works from a clean checkout (A-49)
  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Start the stack and wait for readiness
        run: KEEP_UP=1 scripts/compose-smoke.sh

      - name: Observability profile (Prometheus scrapes, Grafana dashboard loads)
        run: scripts/observability-smoke.sh

      # DAST (A-47): OWASP ZAP API scan of the running app, driven by the OpenAPI contract
      - name: OWASP ZAP API scan
        run: |
          mkdir -p zap && chmod 777 zap && cp docs/api/openapi.yaml zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t openapi.yaml -f openapi -O http://localhost:8080 \
            -r zap-report.html -J zap-report.json -w zap-report.md -I

      - name: DAST gate (fails on any High risk alert)
        run: python3 scripts/zap_gate.py zap/zap-report.json

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dast
          if-no-files-found: warn
          path: zap/zap-report.*

      - name: Stop the stack
        if: always()
        run: docker compose --profile observability down -v --remove-orphans
