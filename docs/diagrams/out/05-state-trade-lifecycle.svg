<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:870px;height:575px;background:#FFFFFF;" width="870px" height="575px" viewBox="0 0 870 575" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="264.339" y="22.995" fill="#000" font-size="14" textLength="335.132" font-weight="700">Trade lifecycle (row in PostgreSQL trades)</text></g><g class="entity" data-qualified-name="NotStored" id="ent0001" data-source-line="5"><rect x="101.34" y="124.297" width="335.793" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="101.34" y1="150.594" x2="437.133" y2="150.594" style="stroke:#181818;stroke-width:0.5;"/><text x="232.445" y="142.292" fill="#000" font-size="14" textLength="73.582">Not stored</text><text x="106.34" y="168.589" fill="#000" font-size="14" textLength="315.793">rejected submission → REJECTED (audit only)</text></g><g class="entity" data-qualified-name="Live" id="ent0002" data-source-line="6"><rect x="7" y="268.887" width="524.479" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="311.481" x2="531.479" y2="311.481" style="stroke:#181818;stroke-width:0.5;"/><text x="221.76" y="286.882" fill="#000" font-size="14" textLength="28.588">Live</text><text x="221.76" y="303.179" fill="#000" font-size="14" textLength="94.958">(expired = N)</text><text x="12" y="329.476" fill="#000" font-size="14" textLength="504.479">valid submission, version >= stored → REPLACED, createdDate = today</text><text x="12" y="345.773" fill="#000" font-size="14" textLength="347.915">rejected submission → REJECTED, row unchanged</text></g><g class="entity" data-qualified-name="Expired" id="ent0003" data-source-line="7"><rect x="63.06" y="476.077" width="412.355" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="63.06" y1="518.671" x2="475.415" y2="518.671" style="stroke:#181818;stroke-width:0.5;"/><text x="222.719" y="494.072" fill="#000" font-size="14" textLength="53.163">Expired</text><text x="222.719" y="510.369" fill="#000" font-size="14" textLength="93.037">(expired = Y)</text><text x="68.06" y="536.666" fill="#000" font-size="14" textLength="392.355">expiry job runs again → no change, no event (US-202.2)</text><text x="68.06" y="552.963" fill="#000" font-size="14" textLength="347.915">rejected submission → REJECTED, row unchanged</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="9"><ellipse cx="269.24" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="21"><path d="M510.66,483.407 L510.66,514.677 L475.83,518.677 L510.66,522.677 L510.66,553.938 A0,0 0 0 0 510.66,553.938 L855.809,553.938 A0,0 0 0 0 855.809,553.938 L855.809,493.407 L845.809,483.407 L510.66,483.407 A0,0 0 0 0 510.66,483.407" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M845.809,483.407 L845.809,493.407 L855.809,493.407 L845.809,483.407" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="516.66" y="500.474" fill="#000" font-size="13" textLength="292.709">Only a new valid version resets expired to N;</text><text x="516.66" y="515.607" fill="#000" font-size="13" textLength="244.607">the expiry job never does (US-204.2).</text><text x="516.66" y="530.739" fill="#000" font-size="13" textLength="324.149">Deletion and cancellation are out of scope (A-40),</text><text x="516.66" y="545.872" fill="#000" font-size="13" textLength="161.713">so there is no final state.</text></g><!--link *start* to NotStored--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="9" data-link-type="dependency"><path d="M269.24,63.787 C269.24,77.717 269.24,99.227 269.24,119.107" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-NotStored"/><polygon points="269.24,124.107,273.24,115.107,269.24,119.107,265.24,115.107,269.24,124.107" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NotStored to Live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="10" data-link-type="dependency"><path d="M269.24,177.127 C269.24,201.777 269.24,234.537 269.24,263.597" style="stroke:#181818;stroke-width:1;" fill="none" id="NotStored-to-Live"/><polygon points="269.24,268.597,273.24,259.597,269.24,263.597,265.24,259.597,269.24,268.597" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="322.608" y="219.954" fill="#000" font-size="13" textLength="118.301">[valid] submission</text><text x="270.24" y="235.087" fill="#000" font-size="13" textLength="223.038">/ ACCEPTED, createdDate = today</text></g><!--link Live to Expired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="11" data-link-type="dependency"><path d="M192.96,354.517 C183.41,363.037 175,372.877 169.24,384.077 C156.64,408.587 156.64,421.567 169.24,446.077 C175,457.287 179.677,463.8 189.227,472.31" style="stroke:#181818;stroke-width:1;" fill="none" id="Live-to-Expired"/><polygon points="192.96,475.637,188.902,466.663,189.227,472.31,183.58,472.636,192.96,475.637" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.493" y="404.644" fill="#000" font-size="13" textLength="64.543">expiry job</text><text x="170.24" y="419.777" fill="#000" font-size="13" textLength="153.048">[maturityDate &lt; today]</text><text x="214.483" y="434.909" fill="#000" font-size="13" textLength="64.562">/ EXPIRED</text></g><!--reverse link Live to Expired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M314.679,358.538 C321.469,367.598 324.48,373.617 328.24,384.077 C337.55,410.017 337.55,420.147 328.24,446.077 C324.48,456.537 318.47,466.557 311.68,475.627" style="stroke:#008000;stroke-width:1;" fill="none" id="Live-backto-Expired"/><polygon points="311.68,354.537,313.877,364.138,314.679,358.538,320.278,359.34,311.68,354.537" fill="#008000" style="stroke:#008000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="336.22" y="397.144" fill="#000" font-size="13" textLength="168.625">[valid, version >= stored]</text><text x="384.088" y="412.277" fill="#000" font-size="13" textLength="72.89">submission</text><text x="338.867" y="427.409" fill="#000" font-size="13" textLength="163.332">/ REPLACED, expired = N</text><text x="381.203" y="442.542" fill="#000" font-size="13" textLength="78.66">(A-09, A-19)</text></g><?plantuml-src bLF1RXen4BtxAvxI2rIxbA9SafP82FRG2b4QKgaLuU3i3k1eiP7jXUuFv0FwYVsIZdSNkgbILRrvPjwyUVDiU-LpmfsL6I5NQqhBbEEEDKSeZRbnVcDfyNaA7o2kAyHMCPHsUr-24wbLUw-C5i9vwGaNC-FXlB6KNK0wSBYeebDzgWvqhplqVQyuYo5ctGeOyYTCKXUVmRxLiAOanFBr2d5cZZg-QGqvdywrm8jhB0yoLzaAhdZOAUTOyRr-Wz5udCplaac4r1AFpYPX_X3UPB8KLUk9fndCL9Mc4e_cuLulTz8NLlcoQdnVDwu2TV9r_k4scOXJNrpibw_OIzAhFrL5E90Dad0pRBnZYkTARvFvT3GEIblEiK6Zk7yLOHI_lUAh-RtzDImzKieRjJR6pwSVJFGn6VFAwCWYKnv6vsLND7egEQsE5vGr92SrV_NjtmeYX5TMw7GhzORlxYM7OGlj83TIrRtQe8P7uKW7qXwTBujuq1_q1jqMnVyE5zhm1bPjjcp9-lpCW4_i3oGq7HjtJevOSkJT-JgymUmTu_sMslerQxJ83Bb6voNhx35kGZc5ZmEfCwHIfvJdiavOWYag6IurU_wDe_YotusuoPd0ptNbmlvhfMMEwjFq135FM4By0W00?></g></svg>