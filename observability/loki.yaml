# Loki: log store for the Trade Store (ADR-012). Single process, local filesystem; receives OTLP logs on /otlp.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true   # OTLP trace_id / span_id are kept as structured metadata, linked to Tempo
  volume_enabled: true
