spring:
  mvc:
    async:
      # CSV exports stream for as long as the client reads (US-503); Tomcat's 30 s default would cut them off.
      request-timeout: ${TRADE_STORE_EXPORT_TIMEOUT:30m}
  application:
    name: trade-store
  # Connection settings come from environment variables (A-47, A-50).
  # The defaults match the local docker-compose stack only.
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tradestore}
    username: ${POSTGRES_USER:tradestore}
    password: ${POSTGRES_PASSWORD:tradestore}
  flyway:
    enabled: true
  mongodb:
    # Spring Boot 4 key (spring.data.mongodb.uri is no longer read)
    uri: ${MONGODB_URI:mongodb://localhost:27017/tradestore}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: trade-store
      auto-offset-reset: earliest   # a new consumer group starts from the oldest unread trade
      enable-auto-commit: false     # offsets are committed by the container after processing (A-43)

server:
  shutdown: graceful

management:
  metrics:
    distribution:
      # Buckets for p95/p99 in Prometheus/Grafana (histogram_quantile), US-604.2
      percentiles-histogram:
        trade.processing: true
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          # A-46: ready only when SQL, NoSQL and the broker are reachable (US-604.1)
          include: readinessState, db, mongo, kafka
          show-details: always
