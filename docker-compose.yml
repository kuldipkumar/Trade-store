# Local stack: `docker compose up --build` (A-49, US-606).
# Image versions match src/test/java/com/tradestore/it/TestcontainersConfiguration.java.
# Credentials below are local-development defaults only; override them through environment variables.

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "29092:29092"   # for producers on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:17.11-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tradestore
      POSTGRES_USER: ${POSTGRES_USER:-tradestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradestore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tradestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.0.34
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: trade-store:local
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/tradestore
      POSTGRES_USER: ${POSTGRES_USER:-tradestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradestore}
      MONGODB_URI: mongodb://mongo:27017/tradestore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
