# Local stack: `docker compose up --build` (A-49, US-606).
# Image versions match src/test/java/com/tradestore/it/TestcontainersConfiguration.java.
# Credentials below are local-development defaults only; override them through environment variables.

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "29092:29092"   # for producers on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:17.11-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tradestore
      POSTGRES_USER: ${POSTGRES_USER:-tradestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradestore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tradestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    # 8.0.38: 8.0.34 refuses to start on Linux kernel 6.19+ (MongoDB SERVER-121912 / SERVER-125742).
    image: mongo:8.0.38
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: trade-store:local
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/tradestore
      POSTGRES_USER: ${POSTGRES_USER:-tradestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradestore}
      MONGODB_URI: mongodb://mongo:27017/tradestore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Traces to Tempo and logs to Loki over OTLP (ADR-012); unset these to stop exporting
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # Observability (US-604, ADR-010, ADR-012), part of the default stack:
  # Grafana http://localhost:3000 (dashboard "Trade Store", anonymous viewer) over Prometheus (metrics, :9090),
  # Tempo (traces, :3200) and Loki (logs, :3100), linked by trace ID.
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage   # latency exemplars link to traces in Tempo
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # query API (Grafana)
      - "4318:4318"   # OTLP over HTTP (the app)
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"   # query API and OTLP log ingestion
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trade-store.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data:
  mongo-data:
